name: On-chain data
on:
  schedule:
    - cron: "40 3 * * *"    # 09:10 IST — after BGeometrics' 03:00 UTC daily update
    - cron: "40 15 * * *"   # 21:10 IST — second BGeometrics batch (free tier: 10/hour, 15/day)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/nightly.yml"]
permissions:
  contents: write
concurrency:
  group: onchain
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Load previous data (keeps metrics from earlier BGeometrics batches)
        run: git clone -q --depth 1 -b data "https://github.com/${{ github.repository }}.git" out || mkdir -p out
      - run: rm -rf out/.git && node scripts/fetch.mjs out
      - name: Publish to the data branch (overwritten each run, so the repo does not grow)
        run: |
          cd out
          git init -q -b data
          git config user.name "onchain-bot"
          git config user.email "onchain-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Data $(date -u +%FT%H:%MZ)"
          git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
